<!DOCTYPE html>
<html lang="ko">

<head>
  <!-- 설명: 한글이 깨지지 않도록 설정합니다. -->
  <meta charset="UTF-8">

  <!-- 설명: 모바일 화면 대응을 위한 설정입니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">

  <title>갤러리</title>
</head>

<body>
  <!-- 실습 흐름: 갤러리는 같은 구조의 카드가 반복된다는 점을 먼저 설명합니다. -->
  <header class="gallery-header">
    <!-- 실습 1: 페이지 제목을 작성합니다. 예: 갤러리 -->
    <h1 class="page-title">갤러리</h1>

    <!-- 실습 2: 갤러리 소개 문구를 작성합니다. -->
    <p class="page-desc">저희 갤러리에 오신 것을 환영합니다!</p>
  </header>

  <main>
    <section class="gallery-section">
      <!-- 실습 3: 섹션 제목을 작성합니다. 예: 추천 이미지 -->
      <h2>추천이미지</h2>


      <div class="gallery-list">
        <!-- 설명: article은 카드 하나처럼 독립적인 콘텐츠를 표현할 때 사용합니다. -->
        <article class="card">
          <!-- 실습 4: alt에는 이미지가 무엇인지 설명하는 문구를 작성합니다. -->
          <img src="https://cdn.aitimes.com/news/photo/202506/200141_200122_2652.png" 
               alt="사진1"
               class="card-img"
                     
           실습 5: 카드 제목을 작성합니다. -->
          <h3 class="card-title">젠슨황</h3>

          <!-- 실습 6: 카드 설명 문장을 작성합니다. -->
          <p class="card-desc">엔비디아</p>

          <button class="card-btn" type="button">자세히 보기</button>

          <!-- 실습 7: 링크 문구를 작성합니다. href="#"는 아직 실제 이동 주소가 없다는 의미입니다. -->
          <a href="#"><!-- 링크 문구 --></a>
        </article>
      
      <div class="gallery-list">
        <!-- 설명: article은 카드 하나처럼 독립적인 콘텐츠를 표현할 때 사용합니다. -->
        <article class="card">
          <!-- 실습 4: alt에는 이미지가 무엇인지 설명하는 문구를 작성합니다. -->
          <img src="https://cdn.bonmedia.kr/news/photo/202602/6277_5908_3315.png" 
               alt="사진2"
               class="card-img"
                     
           실습 5: 카드 제목을 작성합니다. -->
          <h3 class="card-title">비탈릭 부테린</h3>

          <!-- 실습 6: 카드 설명 문장을 작성합니다. -->
          <p class="card-desc">이더리움</p>

          <button class="card-btn" type="button">자세히 보기</button>

          <!-- 실습 7: 링크 문구를 작성합니다. href="#"는 아직 실제 이동 주소가 없다는 의미입니다. -->
          <a href="#"><!-- 링크 문구 --></a>
        </article>
        
      <div class="gallery-list">
        <!-- 설명: article은 카드 하나처럼 독립적인 콘텐츠를 표현할 때 사용합니다. -->
        <article class="card">
          <!-- 실습 4: alt에는 이미지가 무엇인지 설명하는 문구를 작성합니다. -->
          <img src="https://pimg.daara.co.kr/kidd/photo/2022/12/09/1670580836_84.jpg" 
               alt="사진3"
               class="card-img"
                     
           실습 5: 카드 제목을 작성합니다. -->
          <h3 class="card-title">일론머스크</h3>

          <!-- 실습 6: 카드 설명 문장을 작성합니다. -->
          <p class="card-desc">테슬라</p>

          <button class="card-btn" type="button">자세히 보기</button>

          <!-- 실습 7: 링크 문구를 작성합니다. href="#"는 아직 실제 이동 주소가 없다는 의미입니다. -->
          <a href="#"><!-- 링크 문구 --></a>
      </div>
    </section>
  </main>

  <footer>
    <!-- 실습 8: 페이지 하단 문구를 작성합니다. -->
    <p><!-- 푸터 문구 --></p>
  </footer>

  <script src="./js/script.js"></script>
</body>

</html>
